[project]
name = "paritea-ui"
version = "0.1.0"
description = "A web page that runs paritea in the browser."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paritea",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff==0.14.9", # Same pin as the library
]

[tool.uv]
package = false

[tool.uv.sources]
# The library from this repository, installed in editable mode: Python changes in ../src apply immediately,
# and uv rebuilds the Rust extension when ../rust changes (see cache-keys in ../pyproject.toml).
paritea = { path = "..", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
