name: App - Lint and test
on:
  push:
    branches:
      - main
    paths: &app_paths
      - 'app/**'
      - 'src/**'
      - 'rust/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app.yml'
  pull_request:
    paths: *app_paths
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: 'true'
          cache-dependency-glob: 'app/uv.lock'

      - name: Install the app (builds paritea from source)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check --diff .

      - name: Run tests
        run: uv run pytest
